<body>
    <script>
        let guess = Number(prompt("Guess a number :"))
        let attemp = 1;
        while (guess != 15) {
            let guess = Number(prompt("Guess a number :"))
            if (guess > 15) {
                console.log("Hight number ");
            }
            else {
                console.log("Low number");


            }
            attemp++
            if (attemp == 5) {
                break

            }
            console.log("Your Attemp is too much", attemp);
        }
    </script>
